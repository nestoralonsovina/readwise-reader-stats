include:
  - backend/docker-compose.yml

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/readwise_analytics
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      READWISE_API_TOKEN: ${READWISE_API_TOKEN:?Set READWISE_API_TOKEN in .env}
    depends_on:
      - db
    develop:
      watch:
        - action: rebuild
          path: ./backend/src

  frontend:
    build:
      context: ./readwise-analytics
      dockerfile: Dockerfile.dev
    ports:
      - "4200:4200"
    volumes:
      - ./readwise-analytics/src:/app/src
      - /app/node_modules
    depends_on:
      - backend