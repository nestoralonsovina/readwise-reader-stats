spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

readwise:
  api:
    token: test-token-for-testing
    retry:
      max-attempts: 3
      base-delay-seconds: 1
      max-delay-seconds: 5